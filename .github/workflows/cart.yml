name: Cart Service - Build and Push

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ecommerce-platform-dev-cart

jobs:
  build-and-push:
    name: Build and Push Cart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Cart
          role-skip-session-tagging: true

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${TAG}"

      - name: Build Docker image
        working-directory: services/cart
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}"

      - name: Display image
        run: |
          echo "Image pushed:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}"