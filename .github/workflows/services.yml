name: Services - Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/services.yml'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - all
          - product
          - cart
          - order
          - checkout
          - payment

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: ecommerce-platform-dev

permissions:
  contents: read
  id-token: write

jobs:

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.services.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: services
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            SERVICE="${{ inputs.service }}"

            if [ "$SERVICE" = "all" ]; then
              MATRIX='{
                "service": [
                  "product",
                  "cart",
                  "order",
                  "checkout",
                  "payment"
                ]
              }'
            else
              MATRIX=$(printf '{"service":["%s"]}' "$SERVICE")
            fi

            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi


          SERVICES=()

          if git diff --name-only HEAD^ HEAD | grep -q '^services/product/'; then
            SERVICES+=('"product"')
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^services/cart/'; then
            SERVICES+=('"cart"')
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^services/order/'; then
            SERVICES+=('"order"')
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^services/checkout/'; then
            SERVICES+=('"checkout"')
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^services/payment/'; then
            SERVICES+=('"payment"')
          fi


          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${SERVICES[*]}")
            echo "matrix={\"service\":[$JOINED]}" >> "$GITHUB_OUTPUT"
          fi


  build-test-push-deploy:
    name: Deploy ${{ matrix.service }}
    needs: changes

    if: ${{ fromJSON(needs.changes.outputs.matrix).service[0] != null }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ matrix.service }}
          role-skip-session-tagging: true

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Run Go tests
        working-directory: services/${{ matrix.service }}
        run: |
          go test ./...


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: Set service variables
        id: vars
        run: |

          case "${{ matrix.service }}" in

            product)
              echo "repository=ecommerce-platform-dev-product" >> "$GITHUB_OUTPUT"
              echo "ecs_service=ecommerce-platform-dev-product" >> "$GITHUB_OUTPUT"
              echo "task_family=ecommerce-platform-dev-product" >> "$GITHUB_OUTPUT"
              echo "container=product" >> "$GITHUB_OUTPUT"
              ;;

            cart)
              echo "repository=ecommerce-platform-dev-cart" >> "$GITHUB_OUTPUT"
              echo "ecs_service=ecommerce-platform-dev-cart" >> "$GITHUB_OUTPUT"
              echo "task_family=ecommerce-platform-dev-cart" >> "$GITHUB_OUTPUT"
              echo "container=cart" >> "$GITHUB_OUTPUT"
              ;;

            order)
              echo "repository=ecommerce-platform-dev-order" >> "$GITHUB_OUTPUT"
              echo "ecs_service=ecommerce-platform-dev-order" >> "$GITHUB_OUTPUT"
              echo "task_family=ecommerce-platform-dev-order" >> "$GITHUB_OUTPUT"
              echo "container=order" >> "$GITHUB_OUTPUT"
              ;;

            checkout)
              echo "repository=ecommerce-platform-dev-checkout" >> "$GITHUB_OUTPUT"
              echo "ecs_service=ecommerce-platform-dev-checkout" >> "$GITHUB_OUTPUT"
              echo "task_family=ecommerce-platform-dev-checkout" >> "$GITHUB_OUTPUT"
              echo "container=checkout" >> "$GITHUB_OUTPUT"
              ;;

            payment)
              echo "repository=ecommerce-platform-dev-payment" >> "$GITHUB_OUTPUT"
              echo "ecs_service=ecommerce-platform-dev-payment" >> "$GITHUB_OUTPUT"
              echo "task_family=ecommerce-platform-dev-payment" >> "$GITHUB_OUTPUT"
              echo "container=payment" >> "$GITHUB_OUTPUT"
              ;;

          esac


      - name: Build Docker image
        working-directory: services/${{ matrix.service }}
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ steps.vars.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          docker build \
            -t "$IMAGE" \
            .


      - name: Push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ steps.vars.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE"


      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.vars.outputs.task_family }}" \
            --query taskDefinition \
            > task-definition.json


      - name: Clean task definition
        run: |
          python - <<'PY'
          import json

          with open("task-definition.json") as f:
              task = json.load(f)

          fields = [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy"
          ]

          for field in fields:
              task.pop(field, None)

          with open("task-definition-clean.json", "w") as f:
              json.dump(task, f)

          PY


      - name: Update service image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ steps.vars.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os

          image = os.environ["IMAGE"]
          container_name = "${{ steps.vars.outputs.container }}"

          with open("task-definition-clean.json") as f:
              task = json.load(f)

          found = False

          for container in task["containerDefinitions"]:
              if container["name"] == container_name:
                  container["image"] = image
                  found = True

          if not found:
              raise RuntimeError(
                  f"Container '{container_name}' not found in task definition"
              )

          with open("task-definition-final.json", "w") as f:
              json.dump(task, f)

          PY


      - name: Register new task definition
        id: task-definition
        run: |

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-final.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

          echo "Registered:"
          echo "$TASK_DEFINITION_ARN"


      - name: Deploy service to ECS
        run: |

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ steps.vars.outputs.ecs_service }}" \
            --task-definition "${{ steps.task-definition.outputs.task_definition_arn }}"


      - name: Wait for ECS deployment
        run: |

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ steps.vars.outputs.ecs_service }}"


      - name: Deployment successful
        run: |

          echo "======================================"
          echo "${{ matrix.service }} deployment successful"
          echo "======================================"

          echo "Image:"
          echo "${{ env.ECR_REGISTRY }}/${{ steps.vars.outputs.repository }}:${{ steps.image.outputs.tag }}"

          echo ""

          echo "ECS cluster:"
          echo "$ECS_CLUSTER"

          echo ""

          echo "ECS service:"
          echo "${{ steps.vars.outputs.ecs_service }}"

          echo ""

          echo "Task definition:"
          echo "${{ steps.task-definition.outputs.task_definition_arn }}"