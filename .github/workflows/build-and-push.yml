name: Build and Push Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    permissions:
      contents: read
      
    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            product:
              - 'services/product/**'
            cart:
              - 'services/cart/**'
            checkout:
              - 'services/checkout/**'
            order:
              - 'services/order/**'
            payment:
              - 'services/payment/**'

  build-and-push:
    name: Build and Push
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - product
          - cart
          - checkout
          - order
          - payment

    if: ${{ needs.detect-changes.result == 'success' }}

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if service changed
        id: changed
        env:
          SERVICE: ${{ matrix.service }}
          PRODUCT_CHANGED: ${{ needs.detect-changes.outputs.product }}
          CART_CHANGED: ${{ needs.detect-changes.outputs.cart }}
          CHECKOUT_CHANGED: ${{ needs.detect-changes.outputs.checkout }}
          ORDER_CHANGED: ${{ needs.detect-changes.outputs.order }}
          PAYMENT_CHANGED: ${{ needs.detect-changes.outputs.payment }}
        run: |
          case "$SERVICE" in
            product)
              echo "changed=$PRODUCT_CHANGED" >> "$GITHUB_OUTPUT"
              ;;
            cart)
              echo "changed=$CART_CHANGED" >> "$GITHUB_OUTPUT"
              ;;
            checkout)
              echo "changed=$CHECKOUT_CHANGED" >> "$GITHUB_OUTPUT"
              ;;
            order)
              echo "changed=$ORDER_CHANGED" >> "$GITHUB_OUTPUT"
              ;;
            payment)
              echo "changed=$PAYMENT_CHANGED" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set image tag
        if: steps.changed.outputs.changed == 'true'
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: steps.changed.outputs.changed == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          docker build \
            -t $ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        if: steps.changed.outputs.changed == 'true'
        run: |
          docker push \
            $ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }}

      - name: Display image
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "Image pushed:"
          echo "$ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }}"