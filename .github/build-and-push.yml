name: Build and Push Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      product: ${{ steps.filter.outputs.product }}
      cart: ${{ steps.filter.outputs.cart }}
      checkout: ${{ steps.filter.outputs.checkout }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            product:
              - 'services/product/**'

            cart:
              - 'services/cart/**'

            checkout:
              - 'services/checkout/**'

            order:
              - 'services/order/**'

            payment:
              - 'services/payment/**'


  build-and-push:
    name: Build and Push
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - product
          - cart
          - checkout
          - order
          - payment

    if: |
      (matrix.service == 'product' && needs.detect-changes.outputs.product == 'true') ||
      (matrix.service == 'cart' && needs.detect-changes.outputs.cart == 'true') ||
      (matrix.service == 'checkout' && needs.detect-changes.outputs.checkout == 'true') ||
      (matrix.service == 'order' && needs.detect-changes.outputs.order == 'true') ||
      (matrix.service == 'payment' && needs.detect-changes.outputs.payment == 'true')

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: services/${{ matrix.service }}
        run: |
          docker build \
            -t $ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }}

      - name: Display image
        run: |
          echo "Image pushed:"
          echo "$ECR_REGISTRY/ecommerce-platform-dev-${{ matrix.service }}:${{ steps.image.outputs.tag }}"